name: Keep Streamlit app awake

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:         # adds a "Run workflow" button for a manual test

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install a headless browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Open the app like a real visitor
        env:
          APP_URL: https://pm25-lahore.streamlit.app/
        run: |
          python - <<'EOF'
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=120_000)
              page.wait_for_timeout(10_000)
              wake = page.get_by_role("button", name="Yes, get this app back up!")
              if wake.count() > 0:
                  print("App was asleep: clicking the wake-up button")
                  wake.first.click()
                  page.wait_for_timeout(90_000)
              else:
                  print("App is awake")
                  page.wait_for_timeout(30_000)
              browser.close()
          EOF
